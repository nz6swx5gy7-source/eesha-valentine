<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eesha 💖 Valentine Game</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffd6e8, #ffc0da);
    font-family: "Comic Sans MS", "Poppins", cursive;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card {
    background: #fff0f7;
    border-radius: 30px;
    padding: 35px;
    width: 420px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(255,105,180,0.4);
    animation: popIn 0.8s ease;
    position: relative;
  }

  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  h1 {
    color: #ff69b4;
    margin-bottom: 10px;
  }

  p {
    color: #555;
    font-size: 18px;
  }

  button {
    background: #ff69b4;
    border: none;
    padding: 14px 26px;
    border-radius: 40px;
    font-size: 18px;
    cursor: pointer;
    color: white;
    margin-top: 20px;
    box-shadow: 0 8px 20px rgba(255,105,180,0.5);
  }

  button:hover {
    transform: scale(1.05);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 20px;
  }

  .cell {
    background: white;
    border-radius: 15px;
    padding: 15px;
    font-size: 20px;
    cursor: pointer;
    color: #ff69b4;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

    background: #ffb6d9;
    color: white;
