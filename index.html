<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eesha 💖 Valentine</title>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Pacifico&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'Pacifico', cursive;
    overflow-y: auto;
    background: #ffd6e8; /* pink pastel background */
    position: relative;
}

/* Sanrio-style floating stickers behind card */
.sticker {
    position: fixed;
    width: 60px;
    height: 60px;
    z-index: 0;
    pointer-events: none;
}

/* example stickers */
.sticker1 {background: url('https://i.imgur.com/0Hg5O1n.png') no-repeat center/contain;}
.sticker2 {background: url('https://i.imgur.com/qe9gQ6B.png') no-repeat center/contain;}
.sticker3 {background: url('https://i.imgur.com/kT7Lh9k.png') no-repeat center/contain;} /* example Hello Kitty */

body {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.card {
    background: rgba(255, 240, 247, 0.95);
    border-radius: 35px;
    padding: 40px;
    width: 480px;
    text-align: center;
    box-shadow:0 25px 50px rgba(255,105,180,0.5);
    position: relative;
    margin-top: 30px;
    margin-bottom: 30px;
    animation:popIn 0.8s ease;
    z-index:2;
}

@keyframes popIn {from {transform:scale(0.7); opacity:0} to {transform:scale(1);opacity:1}}

h1 {color:#ff69b4;margin-bottom:15px;font-size:38px}
p {color:#555;font-size:20px}

button {
    background:#ff69b4;
    border:none;
    padding:14px 28px;
    border-radius:50px;
    font-size:20px;
    cursor:pointer;
    color:white;
    margin-top:20px;
    box-shadow:0 8px 20px rgba(255,105,180,0.5);
    transition: transform 0.1s ease;
}
button:hover {transform:scale(1.1)}

.grid {
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    gap:6px;
    margin: 20px auto;
    justify-content:center;
}

.cell {
    background:white;
    border-radius:12px;
    padding:12px;
    font-size:18px;
    cursor:pointer;
    color:#ff69b4;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    user-select:none;
}

.cell.selected {background:#ffb6d9;color:white}

.btns {position:relative;height:80px;margin-top:25px}
#yes {left:50%;transform:translateX(-50%);position:absolute}
#no {position:absolute;left:10%;top:10px;background:#ddd;color:#666}

.heart, .star {
    position: fixed;
    font-size:24px;
    animation: floatUp 4s linear forwards;
    z-index:1;
}

.star {font-size:18px; animation: sparkleAnim 2s linear infinite; color:yellow;}

@keyframes floatUp {from {transform:translateY(0);opacity:1} to {transform:translateY(-600px);opacity:0}}
@keyframes sparkleAnim {0%{transform:scale(0.5) rotate(0deg);opacity:0.8}50%{transform:scale(1) rotate(180deg);opacity:1}100%{transform:scale(0.5) rotate(360deg);opacity:0.8}}

.bow {font-size:40px}
</style>
</head>

<body>

<!-- Sanrio stickers in background -->
<div class="sticker sticker1" style="top:10%; left:5%;"></div>
<div class="sticker sticker2" style="top:20%; left:80%;"></div>
<div class="sticker sticker3" style="top:60%; left:50%;"></div>
<div class="sticker sticker1" style="top:75%; left:20%;"></div>
<div class="sticker sticker2" style="top:40%; left:35%;"></div>

<div class="card" id="card">
    <div class="bow">🎀</div>
    <h1>Hi Eesha 💕</h1>
    <p>I made you a super cute game.<br>Win it to unlock your Valentine 💖</p>
    <button id="start">Start Game 🎀</button>
</div>

<audio id="music">
    <source src="https://archive.org/download/stevie-wonder-my-cherie-amour/My%20Cherie%20Amour.mp3" type="audio/mpeg">
</audio>

<script>
const card = document.getElementById("card");
const music = document.getElementById("music");

// Start button triggers music reliably
document.getElementById("start").onclick = () => {
    music.volume = 0.7;
    music.play().catch(()=>{});
    showGame();
}

// Word search with only letters
function showGame(){
    card.innerHTML=`<h1>💗 Word Search 💗</h1>
    <p>Find the words: <strong>LOVE, HEART, HUG, KISS</strong></p>
    <div class="grid" id="grid"></div>`;

    const words=["LOVE","HEART","HUG","KISS"];
    const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""); // only letters
    const grid=document.getElementById("grid");
    let selected="";

    for(let i=0;i<64;i++){ // 8x8 grid
        const div=document.createElement("div");
        div.className="cell";
        div.textContent=letters[Math.floor(Math.random()*letters.length)];
        div.onclick=()=>{
            div.classList.add("selected");
            selected+=div.textContent;
            if(words.every(w=>selected.includes(w))) winGame();
        }
        grid.appendChild(div);
    }
}

// Win animation
function winGame(){
    card.innerHTML=`<h1>✨ You Won! ✨</h1>
    <p>You unlocked something very special 💖</p>
    <button onclick="showQuestion()">Continue 🎀</button>`;
    for(let i=0;i<50;i++) spawnHeart();
    for(let i=0;i<30;i++) spawnStar();
}

// English Valentine Question
function showQuestion(){
    card.innerHTML=`<h1>My Love 💕</h1>
    <p>Will you be my Valentine?</p>
    <div class="btns">
        <button id="yes">YES 💗</button>
        <button id="no">No 🙄</button>
    </div>`;

    const no=document.getElementById("no");
    no.onmouseover=()=>{
        no.style.left=Math.random()*90+"%";
        no.style.top=Math.random()*70+"px";
    }

    document.getElementById("yes").onclick=celebrate;
}

// Celebration
function celebrate(){
    card.innerHTML=`<h1>💖 SHE SAID YES 💖</h1>
    <p>Happy Valentine’s Day, Eesha 💕</p>
    <p>Distance can’t stop my love 💖</p>`;
    for(let i=0;i<60;i++) spawnHeart();
    for(let i=0;i<50;i++) spawnStar();
}

// Floating hearts
function spawnHeart(){
    const heart=document.createElement("div");
    heart.className="heart";
    heart.textContent=["💗","💕","🎀","🌸"][Math.floor(Math.random()*4)];
    heart.style.left=Math.random()*100+"%";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),4000);
}

// Floating stars
function spawnStar(){
    const star=document.createElement("div");
    star.className="star";
    star.textContent="✨";
    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";
    document.body.appendChild(star);
    setTimeout(()=>star.remove(),3000);
}
</script>

</body>
</html>
