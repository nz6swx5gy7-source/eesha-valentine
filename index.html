<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eesha 💖 Be My Valentine</title>
<style>
  body {
    background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
    height: 100vh;
    margin: 0;
    font-family: 'Comic Sans MS', 'Poppins', cursive;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    max-width: 420px;
    position: relative;
  }

  h1 {
    color: #ff69b4;
    margin-bottom: 10px;
  }

  p {
    color: #444;
    font-size: 18px;
  }

  .btns {
    margin-top: 30px;
    position: relative;
    height: 80px;
  }

  button {
    padding: 14px 28px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: absolute;
  }

  #yes {
    background: #ff69b4;
    color: white;
    left: 50%;
    transform: translateX(-50%);
  }

  #no {
    background: #ddd;
    color: #555;
    left: 10%;
  }

  .hidden {
    display: none;
  }

  .hearts {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    width: 100%;
    height: 100%;
  }

  .heart {
    position: absolute;
    font-size: 24px;
    animation: floatUp 3s linear forwards;
  }

  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-600px); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <h1>Hey Eesha 💕</h1>
  <p>Someone far away is thinking about you…<br>
  (Hint: it’s me 😌)</p>
  <p><strong>Tap anywhere to continue</strong></p>
</div>

<div class="hearts" id="hearts"></div>

<audio id="music">
  <source src="https://archive.org/download/stevie-wonder-my-cherie-amour/My%20Cherie%20Amour.mp3" type="audio/mpeg">
</audio>

<script>
  const card = document.getElementById("card");
  const music = document.getElementById("music");
  const hearts = document.getElementById("hearts");

  let started = false;

  document.body.addEventListener("click", () => {
    if (!started) {
      started = true;
      music.play();
      showQuestion();
    }
  });

  function showQuestion() {
    card.innerHTML = `
      <h1>My Love 💖</h1>
      <p>Will you be my Valentine?</p>
      <div class="btns">
        <button id="yes">YES 💕</button>
        <button id="no">No 🙄</button>
      </div>
    `;

    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");

    noBtn.addEventListener("mouseover", moveNo);

    yesBtn.addEventListener("click", () => {
      celebrate();
    });
  }

  function moveNo() {
    const x = Math.random() * 70;
    const y = Math.random() * 40;
    this.style.left = x + "%";
    this.style.top = y + "px";
  }

  function celebrate() {
    card.innerHTML = `
      <h1>💖 SHE SAID YES 💖</h1>
      <p>You just made my heart very happy, Eesha.</p>
      <p>Distance doesn’t change how much I care about you.</p>
      <p>Happy Valentine’s Day, my cherie amour 💕</p>
    `;

    for (let i = 0; i < 40; i++) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💗";
      heart.style.left = Math.random() * 100 + "%";
      heart.style.bottom = "0px";
      hearts.appendChild(heart);

      setTimeout(() => heart.remove(), 3000);
    }
  }
</script>

</body>
</html>
